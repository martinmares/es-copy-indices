[package]
name = "es-copy-indices"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.4", features = ["cargo", "derive"] }
env_logger = "0.11.3"
http-auth-basic = "0.3.3"
human_bytes = { version = "0.4.3", features = ["fast"] }
indicatif = { version = "0.17.8", features = ["tokio"] }
indicatif-log-bridge = "0.2.2"
log = "0.4.21"
memory-stats = "1.1.0"
native-tls = { version = "0.2.11", features = ["vendored"] }
# native-tls = { version = "0.2.11" }
rustls = "0.23.5"
serde = { version = "1.0.198", features = ["derive"] }
serde_json = "1.0.116"
twelf = { version = "0.15.0", features = ["yaml", "json"] }
ureq = { version = "2.9.6", features = ["charset", "json", "native-tls", "gzip", "tls"] }
# ureq = { version = "2.9.6", features = ["native-tls", "json", "charset", "gzip", "tls"] }
